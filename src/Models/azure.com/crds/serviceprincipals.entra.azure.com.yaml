apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    cert-manager.io/inject-ca-from: azureserviceoperator-system/azureserviceoperator-serving-cert
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    app.kubernetes.io/name: azure-service-operator
    app.kubernetes.io/version: v2.22.0
  name: serviceprincipals.entra.azure.com
spec:
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          name: azureserviceoperator-webhook-service
          namespace: azureserviceoperator-system
          path: /convert
          port: 443
      conversionReviewVersions:
      - v1
  group: entra.azure.com
  names:
    kind: ServicePrincipal
    categories:
    - azure
    - entra
    listKind: ServicePrincipalList
    plural: serviceprincipals
    singular: serviceprincipal
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].severity
      name: Severity
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: ServicePrincipal is an Entra service principal for an application.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              appId:
                description: |-
                  AppId is the global application (client) GUID, not the tenant-specific Entra object ID.
                  Required to create a new service principal; existing principals can be adopted by displayName.
                pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                type: string
              displayName:
                description: |-
                  DisplayName identifies an existing principal for adoption, following Application's
                  behavior: multiple matches are an error. An appId is also required if creation is needed.
                minLength: 1
                type: string
              operatorSpec:
                description: OperatorSpec configures adoption and destinations for the resolved IDs.
                properties:
                  configmaps:
                    properties:
                      appId:
                        description: |-
                          ConfigMapDestination describes the location to store a single configmap value
                          Note: This is similar to: SecretDestination in secrets.go.
                          Changes to one may need to be made to the others as well.
                        properties:
                          annotations:
                            additionalProperties:
                              type: string
                            description: Annotations is an optional set of annotations to apply to the ConfigMap.
                            type: object
                          key:
                            description: Key is the key in the ConfigMap being referenced
                            type: string
                          labels:
                            additionalProperties:
                              type: string
                            description: Labels is an optional set of labels to apply to the ConfigMap.
                            type: object
                          name:
                            description: |-
                              Name is the name of the Kubernetes ConfigMap to write to.
                              The ConfigMap will be created in the same namespace as the resource.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      entraID:
                        description: |-
                          ConfigMapDestination describes the location to store a single configmap value
                          Note: This is similar to: SecretDestination in secrets.go.
                          Changes to one may need to be made to the others as well.
                        properties:
                          annotations:
                            additionalProperties:
                              type: string
                            description: Annotations is an optional set of annotations to apply to the ConfigMap.
                            type: object
                          key:
                            description: Key is the key in the ConfigMap being referenced
                            type: string
                          labels:
                            additionalProperties:
                              type: string
                            description: Labels is an optional set of labels to apply to the ConfigMap.
                            type: object
                          name:
                            description: |-
                              Name is the name of the Kubernetes ConfigMap to write to.
                              The ConfigMap will be created in the same namespace as the resource.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  creationMode:
                    description: |-
                      CreationMode defaults to AdoptOrCreate. Set AdoptOnly to resolve an existing
                      service principal without creating one if it is absent in this tenant.
                    enum:
                    - AdoptOrCreate
                    - AlwaysCreate
                    - AdoptOnly
                    type: string
                type: object
            type: object
            x-kubernetes-validations:
            - message: appId or displayName must be specified
              rule: has(self.appId) || has(self.displayName)
            - message: appId must be specified when creationMode is AlwaysCreate
              rule: "!has(self.operatorSpec) || !has(self.operatorSpec.creationMode) || self.operatorSpec.creationMode != 'AlwaysCreate' || has(self.appId)"
          status:
            properties:
              appId:
                description: AppId is the global application (client) GUID.
                type: string
              conditions:
                description: Conditions represent the latest available observations of the service principal's state.
                items:
                  description: Condition defines an extension to status (an observation) of a resource
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is the last time the condition transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: Message is a human readable message indicating details about the transition. This field may be empty.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration is the .metadata.generation that the condition was set based upon. For instance, if
                        .metadata.generation is currently 12, but the .status.condition[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: |-
                        Reason for the condition's last transition.
                        Reasons are upper CamelCase (PascalCase) with no spaces. A reason is always provided, this field will not be empty.
                      type: string
                    severity:
                      description: |-
                        Severity with which to treat failures of this type of condition.
                        For conditions which have positive polarity (Status == True is their normal/healthy state), this will be omitted when Status == True
                        For conditions which have negative polarity (Status == False is their normal/healthy state), this will be omitted when Status == False.
                        This is omitted in all cases when Status == Unknown
                      type: string
                    status:
                      description: Status of the condition, one of True, False, or Unknown.
                      type: string
                    type:
                      description: Type of condition.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              displayName:
                description: DisplayName is the human-readable name of the service principal.
                type: string
              entraID:
                description: EntraID is the tenant-specific object ID, suitable for role assignments.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}